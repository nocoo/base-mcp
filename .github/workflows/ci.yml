name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      package-manager: "pnpm"
      node-version: "22.23.2"
      prepare-command: "pnpm run build"
      coverage-path: "coverage"
      test-command: "pnpm run test:coverage"
      lockfiles: "pnpm-lock.yaml"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
