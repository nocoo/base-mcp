name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      package-manager: "pnpm"
      node-version: "22.23.2"
      prepare-command: "pnpm run build"
      coverage-path: "coverage"
      test-command: "pnpm run test:coverage"
      lockfiles: "pnpm-lock.yaml"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
