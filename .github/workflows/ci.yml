name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      package-manager: "pnpm"
      node-version: "22.23.2"
      build: true
      build-command: "pnpm run build"
      test-command: "pnpm run test:coverage"
      coverage-path: "coverage"
      lockfiles: "pnpm-lock.yaml"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
    secrets: inherit
