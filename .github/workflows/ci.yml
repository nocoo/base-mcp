name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      package-manager: "pnpm"
      node-version: "22.23.4"
      prepare-command: "pnpm run build"
      coverage-path: "coverage"
      test-command: "pnpm run test:coverage"
      lockfiles: "pnpm-lock.yaml"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
