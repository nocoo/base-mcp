# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, Z1 via quality.yml;
# na L1.5, L3; todo L2, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      package-manager: pnpm
      runtime-version: "10.33.0"
      node-version: "26.12.1"
      install-policy: blocked
      prepare-command: pnpm run build
      coverage-path: coverage
      test-command: pnpm run test:coverage
      lockfiles: pnpm-lock.yaml
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: pnpm run build
      workflow-lint: true
      typecheck: true
      lint: true
      unit: true
      security: true
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "本仓库为 Node MCP 库，非 Cloudflare Worker 项目"},
        "L2": {"status": "todo", "reason": "尚无真实 HTTP MCP/OAuth 传输层验收测试（AGENTS.md L2 仍为 planned）"},
        "L3": {"status": "na", "reason": "无浏览器界面"},
        "P1": {"status": "todo", "reason": "发布 npm 包但尚未接入 ci:package / package-check 命令"},
        "Z1": {"status": "impl"}}
